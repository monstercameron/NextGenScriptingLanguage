name: Package validation
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  packages:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Same compiler as the native checks (stable at 1.99.1); pinned so release builds are reproducible.
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: package-${{ matrix.target }}
      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools rpm
      - run: python3 tests/releases.py
      - name: Build release binaries with reproducible path settings
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup"
          cargo build --locked --profile dist --features full --target '${{ matrix.target }}' --bins
      - name: Build archives and Linux packages
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          extra=()
          if [[ "$RUNNER_OS" == Linux ]]; then extra+=(--linux-packages); fi
          python3 tools/package.py --target "$BUILD_TARGET" --binaries "target/$BUILD_TARGET/dist" "${extra[@]}"
      - name: Extract and run archive
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          archives = list(pathlib.Path('dist').glob('*.zip')) + list(pathlib.Path('dist').glob('*.tar.gz'))
          if len(archives) != 1: raise SystemExit('expected one native archive')
          subprocess.run(['python3', 'tools/package_smoke.py', '--archive', str(archives[0])], check=True)
          PY
      - name: Install DEB on ephemeral runner
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i dist/*.deb
          python3 tools/package_smoke.py --root / --system
      - name: Inspect and extract RPM payload
        if: runner.os == 'Linux'
        run: |
          rpm -qpi dist/*.rpm
          mkdir -p target/rpm-smoke
          rpm2cpio dist/*.rpm | (cd target/rpm-smoke && cpio -idm --quiet)
          python3 tools/package_smoke.py --root target/rpm-smoke --system
      - name: Install RPM on ephemeral runner
        if: runner.os == 'Linux'
        run: |
          sudo rpm -i dist/*.rpm
          execute --version
          execute model --help
          execute-applet --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    # Flathub runtime/SDK commits are not recorded in this repository. Keep this
    # package smoke test non-blocking until org.freedesktop.Platform and
    # org.freedesktop.Sdk are pinned to immutable runtime commits.
    continue-on-error: true
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ matrix.target }}
          path: dist
      - name: Install Flatpak tools and runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Build and execute sandboxed bundle
        env:
          FLATPAK_ARCH: ${{ matrix.arch }}
        run: dbus-run-session -- python3 tools/flatpak.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/*.flatpak
          if-no-files-found: error
          retention-days: 14
  arch:
    name: Arch packages (x86_64)
    # archlinux:latest and its rolling repositories are not pinned to an image
    # digest or archive date, so this smoke test is not a release gate. Pin both
    # before making it blocking.
    continue-on-error: true
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-x86_64-unknown-linux-musl
          path: dist
      - name: Render the AUR PKGBUILDs from this checkout and its release archive
        run: |
          version=$(python3 tools/release.py version)
          mkdir -p stage
          git archive --format=tar.gz --prefix="NextGenScriptingLanguage-$version/" \
            -o "stage/NextGenScriptingLanguage-$version.tar.gz" HEAD
          python3 tools/aur.py render --out pkgs \
            --linux-x64 "dist/execute-$version-linux-x64.tar.gz" \
            --source "stage/NextGenScriptingLanguage-$version.tar.gz"
      - name: Build, install, and smoke-test both packages in Arch
        run: docker run --rm -v "$PWD:/work" -w /work archlinux:latest sh /work/tools/arch_test.sh
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Write the release SBOM from the locked dependency graph
        run: |
          version=$(python3 tools/release.py version)
          python3 tools/sbom.py --out "dist/execute-$version.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-sbom
          path: dist/*.cdx.json
          if-no-files-found: error
          retention-days: 14
  reproducible:
    name: Reproducible build (x86_64 musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # Two checkouts at different paths: the build must not depend on where it runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: build-a
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: build-b
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Same compiler as the native checks (stable at 1.99.1); pinned so release builds are reproducible.
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
      - name: Build twice from different paths and compare every shipped binary
        run: |
          SOURCE_DATE_EPOCH="$(git -C build-a log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          for side in build-a build-b; do
            (
              cd "$side"
              RUSTFLAGS="--remap-path-prefix=$PWD=/build --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup" \
                cargo build --locked --profile dist --features full --bins --target x86_64-unknown-linux-musl
            )
          done
          for name in execute execute-model execute-applet; do
            a="build-a/target/x86_64-unknown-linux-musl/dist/$name"
            b="build-b/target/x86_64-unknown-linux-musl/dist/$name"
            sha256sum "$a" "$b"
            cmp "$a" "$b"
          done
          echo "Every binary is byte-identical across two builds from different paths."
