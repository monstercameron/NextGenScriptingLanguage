name: Native checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Each commit on main gets its own group, so every pushed commit runs to completion and
  # nothing is replaced while queued. Other refs share a group and cancel stale runs.
  group: native-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  feature-matrix:
    # Every optional feature alone, the core build and the default build, linted in one
    # job per platform with one shared cache. Standalone model tests run here too. The
    # full feature set is linted and tested by the Unix and Windows jobs below.
    name: Feature matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check test feature requirements
        run: python3 tools/test_ci_feature_matrix.py
      - name: Clippy every feature combination
        shell: bash
        run: |
          set -euo pipefail
          for args in "--no-default-features" \
                      "--no-default-features --features graph" \
                      "--no-default-features --features screens" \
                      "--no-default-features --features records" \
                      "--no-default-features --features tooling" \
                      "--no-default-features --features module-tools" \
                      "--no-default-features --features agent-advisory" \
                      "--no-default-features --features model" \
                      ""; do
            echo "::group::cargo clippy $args"
            # shellcheck disable=SC2086
            cargo clippy --locked $args --all-targets -- -D warnings
            echo "::endgroup::"
          done
      - name: Install Bubblewrap for Linux sandbox tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Check the model-only build and helper environment
        run: cargo test --locked --no-default-features --features model --test model_env_minimize
      - name: Test the core and default builds
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --no-default-features --features test-fixtures --lib --tests
          cargo test --locked --features test-fixtures --lib --tests
      - name: Measure Linux required-sandbox spawn overhead
        if: runner.os == 'Linux'
        run: >-
          cargo test --locked --release --features test-fixtures --lib
          platform::sandbox::tests::required_sandbox_100_spawn_overhead_and_probe_frequency
          -- --ignored --nocapture --test-threads=1
      - name: Test standalone model feature
        run: cargo test --locked --no-default-features --features model --lib --tests
      - name: Verify daemon fallback across Linux namespaces
        if: runner.os == 'Linux'
        env:
          EXECUTE_REQUIRE_NAMESPACE_TESTS: "1"
        run: cargo test --locked --test daemon_cli linux_namespace_clients_run_locally -- --nocapture
  workflows:
    name: Release contracts and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tests/releases.py
      - run: python3 -O tests/releases.py
      - name: Every unsafe block and impl has a SAFETY comment, on every platform
        run: python3 tools/check_unsafe.py
      - name: Install pinned workflow validator
        run: GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$RUNNER_TEMP/actionlint/actionlint" -color'
  linux-budgets:
    # Size, latency, hot-path and port budgets for the default Linux build. A job of its
    # own, so a failing test elsewhere no longer skips these checks.
    name: Linux budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: jq --version
      - name: Prove latency gate rejects a 20% startup regression
        run: python3 tests/test_latency_budget_regression.py
      - name: Prove Linux latency gate reports independent child RSS
        run: python3 tests/test_latency_budget_rss.py
      - name: Check Linux default release binary size
        id: linux_binary_size
        run: |
          cargo build --locked --release --bin execute
          python3 tools/check_binary_size.py target/release/execute tools/linux-binary-budget.json
      # Temporary diagnostic for the binary-size boundary: same-runner paired
      # comparison tells real growth apart from runner/toolchain noise without
      # moving the absolute ceiling. Remove once the gate is green and the
      # retained samples have justified a re-budget.
      - name: Diagnose failed binary size with push parent on the same runner
        id: paired_binary_size
        if: failure() && steps.linux_binary_size.outcome == 'failure' && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid base revision: $BASE_SHA" >&2
            exit 1
          fi
          parent_worktree="$RUNNER_TEMP/binary-size-parent-src"
          candidate_bin="$RUNNER_TEMP/execute-size-candidate"
          baseline_bin="$RUNNER_TEMP/execute-size-baseline"
          cp target/release/execute "$candidate_bin"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          worktree_added=0
          cleanup() {
            status=$?
            trap - EXIT
            if (( worktree_added )); then
              git worktree remove --force "$parent_worktree" || status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          git worktree add --detach "$parent_worktree" "$BASE_SHA"
          worktree_added=1
          CARGO_TARGET_DIR="$RUNNER_TEMP/binary-size-paired-target" cargo build --locked --release --manifest-path "$parent_worktree/Cargo.toml" --bin execute
          cp "$RUNNER_TEMP/binary-size-paired-target/release/execute" "$baseline_bin"
          python3 tools/compare_binary_size.py \
            --baseline "$baseline_bin" \
            --candidate "$candidate_bin" \
            --baseline-label "$BASE_SHA" \
            --candidate-label "$HEAD_SHA" \
            --json-out target/paired-binary-size.json
      - name: Save paired binary-size samples
        if: always() && steps.paired_binary_size.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-binary-size-paired-${{ github.run_id }}
          path: target/paired-binary-size.json
          if-no-files-found: error
          retention-days: 14
      - name: Compare Omarchy ports with their Bash originals
        run: python3 tools/port_compare.py --binary target/release/execute
      - name: Test paired latency comparison tool
        run: python3 tools/test_paired_latency.py
      - name: Test paired binary-size comparison tool
        run: python3 tools/test_compare_binary_size.py
      - name: Test existing latency budget limits
        run: python3 -m unittest tests/test_latency_budget_limits.py -v
      - name: Test benchmark manifest command selection
        run: python3 -m unittest tests/test_bench_budget.py -v
      - name: Measure Linux latency budget
        id: linux_latency
        run: python3 tools/check_latency.py target/release/execute tools/linux-latency-budget.json --manifest-dir manifests --require-rss --json-out target/linux-latency-samples.json
      - name: Save Linux latency samples
        if: always() && (steps.linux_latency.outcome == 'success' || steps.linux_latency.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-latency-samples-${{ github.run_id }}
          path: target/linux-latency-samples.json
          if-no-files-found: error
          retention-days: 14
      - name: Compare failed latency budget with push parent on the same runner
        id: paired_latency
        if: failure() && steps.linux_latency.outcome == 'failure' && github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid base revision: $BASE_SHA" >&2
            exit 1
          fi
          parent_worktree="$RUNNER_TEMP/latency-parent-src"
          candidate_bin="$RUNNER_TEMP/execute-candidate"
          baseline_bin="$RUNNER_TEMP/execute-baseline"
          cp target/release/execute "$candidate_bin"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          worktree_added=0
          cleanup() {
            status=$?
            trap - EXIT
            if (( worktree_added )); then
              git worktree remove --force "$parent_worktree" || status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          git worktree add --detach "$parent_worktree" "$BASE_SHA"
          worktree_added=1
          CARGO_TARGET_DIR="$RUNNER_TEMP/latency-paired-target" cargo build --locked --release --manifest-path "$parent_worktree/Cargo.toml" --bin execute
          cp "$RUNNER_TEMP/latency-paired-target/release/execute" "$baseline_bin"
          python3 tools/compare_latency.py \
            --baseline "$baseline_bin" \
            --candidate "$candidate_bin" \
            --baseline-label "$BASE_SHA" \
            --candidate-label "$HEAD_SHA" \
            --manifest-dir "$GITHUB_WORKSPACE/manifests" \
            --json-out target/paired-latency.json
      - name: Save paired latency samples
        if: always() && steps.paired_latency.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-latency-paired-${{ github.run_id }}
          path: target/paired-latency.json
          if-no-files-found: error
          retention-days: 14
      - name: Measure hot-path benchmarks
        shell: bash
        run: |
          set -euo pipefail
          baseline_src="$RUNNER_TEMP/parallel-each-baseline-src"
          baseline_target="$RUNNER_TEMP/parallel-each-baseline-target"
          git fetch --no-tags --depth=1 origin 35483ce
          git worktree add --detach "$baseline_src" 35483ce
          CARGO_TARGET_DIR="$baseline_target" cargo build --locked --release --manifest-path "$baseline_src/Cargo.toml" --bin execute
          python3 tools/bench_budget.py target/release/execute tools/linux-bench-budget.json \
            --baseline-binary "$baseline_target/release/execute"
      - name: Check Linux minimal build size and tests
        run: |
          cargo build --locked --release --bin execute --no-default-features
          python3 tools/check_binary_size.py target/release/execute tools/linux-minimal-binary-budget.json
          cargo test --locked --no-default-features --lib
  unix:
    name: Unix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-15' && 45 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: jq --version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: editors/vscode
      - run: make check
      - run: make unix-smoke
      - run: make proof-smoke
      - run: npm run package
        working-directory: editors/vscode
        env:
          EXECUTE_TEST_BINARY: ${{ github.workspace }}/target/release/execute
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-proofs-${{ matrix.os }}
          path: |
            target/unix-matrix.json
            target/proof-smoke.json
          if-no-files-found: warn
          retention-days: 14
  windows:
    name: Native Windows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: rustfmt --edition 2021 --check src/runtime/shared.rs
      - run: cargo clippy --locked --features full,test-fixtures --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo build --locked --target ${{ matrix.target }} --release --features full,test-fixtures --bins
      - name: Verify Git for Windows MSYS printf fixture
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:ProgramFiles "Git/usr/bin/printf.exe")
            (where.exe printf.exe 2>$null)
          )
          $fixture = $candidates | Where-Object {
            (Test-Path -LiteralPath $_) -and
            (Test-Path -LiteralPath (Join-Path (Split-Path -Parent $_) "msys-2.0.dll"))
          } | Select-Object -First 1
          if (-not $fixture) {
            throw "Git for Windows MSYS printf.exe and sibling msys-2.0.dll are required for the Windows argv regression."
          }
          Write-Host "Verified MSYS printf fixture: $fixture"
      - name: Install manifest fixture beside the release test binaries
        shell: pwsh
        run: |
          $fixture = "target/${{ matrix.target }}/manifests"
          if (Test-Path $fixture) { Remove-Item $fixture -Recurse -Force }
          Copy-Item -Path manifests -Destination $fixture -Recurse

      - run: cargo test --locked --target ${{ matrix.target }} --release --features full,test-fixtures --test windows_native --test parallel_each_windows --test worker_backend_windows --test named_background_jobs --test models --test opt_manifest_regressions --test check_json --test manifest_catalog --test prompt_inputs --test child_env_minimize_windows --test lane_w1_regressions -- --test-threads=1
      - run: cargo test --locked --target ${{ matrix.target }} --release --features full,test-fixtures --lib -- --test-threads=1
