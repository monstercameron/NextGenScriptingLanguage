[package]
name = "execute"
version = "0.9.0-rc.5"
edition = "2021"
default-run = "execute"
description = "Readable Unix workflows with declarative applets and direct pipes"
license = "MIT"
repository = "https://github.com/monstercameron/NextGenScriptingLanguage"
homepage = "https://monstercameron.github.io/NextGenScriptingLanguage/"
readme = "README.md"
keywords = ["scripting", "unix", "pipeline", "interpreter", "automation"]
categories = ["command-line-utilities"]

[lib]
name = "flow"

[dependencies]
anyhow = "1"
memchr = "2.8.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
url = "2.5.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
libc = "0.2"
signal-hook = "0.3"
chrono = "0.4"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
mio = { version = "1.2.4", features = ["net", "os-poll"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "=3.4.2", default-features = false, features = ["native-tls"] }
mio = { version = "1.2.4", features = ["net", "os-poll"] }
ctrlc = "3.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

# Release artifacts: one codegen unit trades build time for a smaller binary.
[profile.dist]
inherits = "release"
codegen-units = 1

[patch.crates-io]
iana-time-zone = { path = "vendor/iana-time-zone" }

[[example]]
name = "native-fixture"
path = "tests/fixtures/native_fixture.rs"
