name: Execute vs bash
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bash-compare-${{ github.sha }}
  cancel-in-progress: false
jobs:
  compare:
    name: Compare with bash and dash (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The default build is what a distro would ship as a shell replacement.
      - run: cargo build --locked --release --bin execute
      - run: sudo apt-get install -y --no-install-recommends time strace
      - run: bash --version | head -1 && jq --version && ls -l /usr/bin/dash
      - name: Compare
        run: python3 tools/bash_compare.py target/release/execute --manifest-dir manifests --json-out target/bash-compare.json
      # Where the startup time goes, for the optimisation lanes: syscalls, the
      # dynamic loader's own cost, and the binary's sections.
      - name: Profile startup
        run: |
          echo 'use value ""' > "$RUNNER_TEMP/startup.program"
          program=(target/release/execute run "$RUNNER_TEMP/startup.program" --manifest-dir manifests)
          ldd target/release/execute
          size -A target/release/execute | sort -k2 -n | tail -n 12
          strace -f -c -o "$RUNNER_TEMP/strace-count.txt" "${program[@]}"
          cat "$RUNNER_TEMP/strace-count.txt"
          strace -f -r -o "$RUNNER_TEMP/strace-timeline.txt" "${program[@]}"
          cat "$RUNNER_TEMP/strace-timeline.txt"
          LD_DEBUG=statistics "${program[@]}" 2>&1 | head -n 20
          strace -f -c -o "$RUNNER_TEMP/bash-count.txt" bash --norc --noprofile -c :
          tail -n 4 "$RUNNER_TEMP/bash-count.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bash-compare-${{ matrix.os }}
          path: target/bash-compare.json
          if-no-files-found: warn
          retention-days: 30
