# cargo-audit policy. The same advisories are accepted in deny.toml, with the reasons
# recorded there. Run as `cargo audit --deny warnings` in the security workflow.
[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste, build-time proc-macro through ratatui 0.29 (tui feature)
    "RUSTSEC-2026-0002", # lru IterMut, through the ratatui 0.29 layout cache
    "RUSTSEC-2026-0253", # lru pop() panic safety, through the ratatui 0.29 layout cache
]
