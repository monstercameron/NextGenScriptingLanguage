name: Crash consistency (nightly)
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crash:
    name: Kill and write-failure harness
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: crash-consistency
      - name: Random kills and injected checkpoint write failures
        env:
          CRASH_TRIALS: "40"
          CRASH_SEED: ${{ github.run_id }}
        run: cargo test --locked --features failpoints --test crash_consistency -- --test-threads=1 --nocapture
      - name: Parser and journal decoding properties
        env:
          PROPTEST_CASES: "1024"
        run: cargo test --locked --test crash_properties
      - name: Keep failing property cases
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-consistency-regressions
          path: tests/*.proptest-regressions
          if-no-files-found: ignore
          retention-days: 30
