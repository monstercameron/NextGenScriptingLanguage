name: Performance candidate source validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: typed-json-carry-v2
            base: e5fa5162b9bdca608f7f3c9d0d273db40a93c17b
            patch: typed-json-carry-v2.patch.xz
            xz_sha256: 66e48efa5a79b74251da56a892582771b1209d8c8c9a38f4bff4bba7cb8aa62c
            patch_sha256: 0305d8b2ab6c7d0650d7fb384c143375d33801fdbc6dadf0e2e85799930d1e50
    env:
      CANDIDATE_NAME: ${{ matrix.name }}
      BASE_COMMIT: ${{ matrix.base }}
      PATCH_NAME: ${{ matrix.patch }}
      PATCH_XZ_SHA256: ${{ matrix.xz_sha256 }}
      PATCH_SHA256: ${{ matrix.patch_sha256 }}
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.base }}
          path: candidate-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - name: Apply and record the exact frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/candidate-compile-target" >> "$GITHUB_ENV"
          printf '%s  %s\n' "$PATCH_XZ_SHA256" "benchmarks/candidate_compile/$PATCH_NAME" | sha256sum --check
          xz -dc "benchmarks/candidate_compile/$PATCH_NAME" > evidence/product.patch
          printf '%s  %s\n' "$PATCH_SHA256" evidence/product.patch | sha256sum --check
          test "$(git -C candidate-source rev-parse HEAD)" = "$BASE_COMMIT"
          git -C candidate-source apply --check "$GITHUB_WORKSPACE/evidence/product.patch"
          git -C candidate-source apply "$GITHUB_WORKSPACE/evidence/product.patch"
          git -C candidate-source diff --check
          git -C candidate-source diff --binary > evidence/applied-source.patch
          cargo --version > evidence/tool-versions.txt
          rustc -Vv >> evidence/tool-versions.txt
      - name: Check formatting and strict native Clippy
        working-directory: candidate-source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "$GITHUB_WORKSPACE/evidence/native-clippy.log"
      - name: Check WebAssembly and both Windows targets
        working-directory: candidate-source
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --manifest-path browser/Cargo.toml --locked --target wasm32-unknown-unknown -- -D warnings 2>&1 | tee "$GITHUB_WORKSPACE/evidence/wasm-clippy.log"
          cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings 2>&1 | tee "$GITHUB_WORKSPACE/evidence/windows-x64-clippy.log"
          cargo clippy --locked --target aarch64-pc-windows-msvc --all-targets -- -D warnings 2>&1 | tee "$GITHUB_WORKSPACE/evidence/windows-arm64-clippy.log"
      - name: Execute release library and focused integration regressions
        working-directory: candidate-source
        shell: bash
        run: |
          set -euo pipefail
          targets=(--lib)
          case "$CANDIDATE_NAME" in
            typed-json-carry-v2) targets+=(--test typed_contracts) ;;
            program-cache-v3-1) targets+=(--test program_modules) ;;
            borrowed-response) targets+=(--test worker_backend) ;;
            *) exit 2 ;;
          esac
          cargo build --locked --release --bins 2>&1 | tee "$GITHUB_WORKSPACE/evidence/bundled-binaries-build.log"
          cp "$CARGO_TARGET_DIR/release/execute-applet" "$CARGO_TARGET_DIR/release/deps/execute-applet"
          cmp "$CARGO_TARGET_DIR/release/execute-applet" "$CARGO_TARGET_DIR/release/deps/execute-applet"
          sha256sum "$CARGO_TARGET_DIR/release/execute-applet" "$CARGO_TARGET_DIR/release/deps/execute-applet" > "$GITHUB_WORKSPACE/evidence/bundled-helper-placement.sha256"
          cargo test --locked --release "${targets[@]}" -- --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/evidence/release-regressions.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: candidate-source-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: warn
          retention-days: 30
