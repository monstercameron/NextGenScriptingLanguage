name: Bug report
description: Report an unexpected result with a reproducible program.
body:
  - type: markdown
    attributes:
      value: |
        Include a small reproduction using local fixtures. Remove credentials and personal data from source, logs and `.env` contents before sharing.
  - type: input
    id: version
    attributes:
      label: Version and installation
      description: Include execute --version or the source commit; specify archive, source, package or browser playground.
      placeholder: 0.9.0-rc.4, source build
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, architecture, relevant applet versions, or browser version.
      placeholder: macOS 15 arm64; or Windows 11 x64; or Chromium 145
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Small .program source, fixture data and the exact command. Use a temporary workspace.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include stdout, stderr and exit status when relevant.
    validations:
      required: true
