name: Crash consistency (nightly)
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crash:
    name: Kill and write-failure harness (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: crash-consistency
      - name: Verify dm-flakey cleanup failures stay visible without privileges
        if: runner.os == 'Linux'
        run: bash tools/test_crash_consistency_dm_flakey_cleanup.sh
      - name: Random kills and injected checkpoint write failures
        env:
          CRASH_TRIALS: "40"
          CRASH_SEED: ${{ github.run_id }}
        run: cargo test --locked --features failpoints --test crash_consistency -- --test-threads=1 --nocapture
      - name: Require a disposable GitHub-hosted VM for dm-flakey
        if: runner.os == 'Linux' && runner.environment != 'github-hosted'
        run: |
          echo "::error::The privileged dm-flakey harness requires a GitHub-hosted ephemeral Linux VM."
          exit 1
      - name: Drop checkpoint writeback bios on an isolated loopback filesystem (Linux only)
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        env:
          CARGO_BUILD_JOBS: "1"
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dmsetup e2fsprogs
          sudo modprobe dm_mod
          sudo modprobe dm_flakey
          cargo build --locked --features failpoints --bin execute
          bash tools/crash_consistency_dm_flakey.sh
      - name: Parser and journal decoding properties
        env:
          PROPTEST_CASES: "1024"
        run: cargo test --locked --test crash_properties
      - name: Keep failing property cases
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-consistency-regressions
          path: tests/*.proptest-regressions
          if-no-files-found: ignore
          retention-days: 30
