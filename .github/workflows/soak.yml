name: Soak (nightly)
on:
  schedule:
    - cron: '41 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soak:
    name: Soak (${{ matrix.scenario }}, one hour)
    strategy:
      fail-fast: false
      matrix:
        scenario: [service, live, graph]
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: soak
      - name: Build the release binary with the live control plane
        run: cargo build --locked --release --features full --bin execute
      - name: Soak for an hour and assert flat resources
        run: >-
          python3 tools/soak.py --binary target/release/execute
          --scenario "${{ matrix.scenario }}"
          --duration 3600 --warmup 300 --interval 5
          --out "target/soak-${{ matrix.scenario }}.json"
      - name: Keep the soak report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-${{ matrix.scenario }}
          path: target/soak-${{ matrix.scenario }}.json
          if-no-files-found: ignore
          retention-days: 30
