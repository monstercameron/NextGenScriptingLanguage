name: Native checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Each commit on main gets its own group, so every pushed commit runs to completion and
  # nothing is replaced while queued. Other refs share a group and cancel stale runs.
  group: native-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  feature-matrix:
    # Every optional feature alone, the core build and the default build, linted in one
    # job per platform with one shared cache. Standalone model tests run here too. The
    # full feature set is linted and tested by the Unix and Windows jobs below.
    name: Feature matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restrict the manifests directory to trusted writers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Same runner-ACL restriction as the Native Windows job: the checkout grants
          # BUILTIN\Users and Authenticated Users write rights, which the gate refuses.
          $userSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $manifests = Join-Path $env:GITHUB_WORKSPACE "manifests"
          & "$env:WINDIR\System32\icacls.exe" $manifests /inheritance:r `
            /grant:r "*$($userSid):(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F"
          if ($LASTEXITCODE -ne 0) { throw "Could not restrict the manifests directory" }
          # Reset the contents to inherit the restricted directory. Applying /grant:r
          # recursively would leave the files with no access entries at all.
          & "$env:WINDIR\System32\icacls.exe" "$manifests\*" /reset /T /C
          if ($LASTEXITCODE -ne 0) { throw "Could not reset the manifests contents" }
      - name: Prepare trusted Windows test and build roots
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The trusted-input gate checks every ancestor. ProgramData and the
          # workspace have runner ACLs that grant foreign write rights, so
          # use a fresh NTFS volume whose root is the trust boundary.
          $vhd = Join-Path $env:RUNNER_TEMP "ngs-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.vhdx"
          "NGS_TEST_VHD_PATH=$vhd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $letters = @('Z','Y','X','W','V','U','T','S','R','Q','P','O','N','M','L','K','J','I','H','G','F','E')
          $letter = $letters | Where-Object { -not (Get-PSDrive -Name $_ -ErrorAction SilentlyContinue) } | Select-Object -First 1
          if (-not $letter) { throw "No free drive letter for the trusted Windows CI volume" }
          $diskpart = Join-Path $env:RUNNER_TEMP "ngs-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.diskpart"
          $commands = @(
            "create vdisk file=`"$vhd`" maximum=32768 type=expandable",
            "select vdisk file=`"$vhd`"",
            "attach vdisk",
            "create partition primary",
            "format fs=ntfs quick label=NGSCI",
            "assign letter=$letter",
            "exit"
          )
          [System.IO.File]::WriteAllLines($diskpart, $commands, [System.Text.Encoding]::ASCII)
          & "$env:WINDIR\System32\diskpart.exe" /s $diskpart
          if ($LASTEXITCODE -ne 0) { throw "Could not create the trusted Windows CI volume" }
          $driveRoot = $letter + ":" + [System.IO.Path]::DirectorySeparatorChar
          $userSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & "$env:WINDIR\System32\icacls.exe" $driveRoot /setowner "*$userSid"
          if ($LASTEXITCODE -ne 0) { throw "Could not set the trusted Windows CI volume owner" }
          & "$env:WINDIR\System32\icacls.exe" $driveRoot /inheritance:r `
            /grant:r "*$($userSid):(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F"
          if ($LASTEXITCODE -ne 0) { throw "Could not secure the trusted Windows CI volume" }
          # /inheritance:r keeps explicit ACEs the format wrote. Those grant Users and
          # Authenticated Users write rights that every child temp directory inherits,
          # so the trusted-input gate refuses the test temp roots. Remove them.
          & "$env:WINDIR\System32\icacls.exe" $driveRoot /remove:g "*S-1-5-32-545" "*S-1-5-11" "*S-1-1-0"
          if ($LASTEXITCODE -ne 0) { throw "Could not remove foreign write rights from the trusted Windows CI volume" }
          $target = Join-Path $driveRoot "target"
          $temp = Join-Path $driveRoot "temp"
          New-Item -ItemType Directory -Path $target, $temp | Out-Null
          "CARGO_TARGET_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Tests load the repository's own manifests folder, and the gate checks every
          # ancestor of it. The checkout lives under a runner directory that grants
          # Authenticated Users modify rights, which no ACL change on the manifests
          # folder alone can fix. Build and test from a copy on the trusted volume.
          $source = Join-Path $driveRoot "src"
          & "$env:WINDIR/System32/robocopy.exe" $env:GITHUB_WORKSPACE $source /E /XD target /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "Could not copy the checkout to the trusted Windows CI volume" }
          $global:LASTEXITCODE = 0
          "NGS_SRC=$source" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # On Windows the build target is on a volume that is detached before the cache
          # saves, so only the registry is cached there.
          cache-targets: ${{ runner.os != 'Windows' }}
      - name: Check test feature requirements
        run: python3 tools/test_ci_feature_matrix.py
      - name: Check nightly flaky-test detection wiring
        run: python3 tools/test_collect_flaky.py
      - name: Check Unix-only integration test list
        run: python3 tools/test_unix_only_tests.py
      - name: Check sandbox-denial lane guards
        run: python3 tools/test_sandbox_denial_workflow.py
      - name: Regenerate and check replacement gate summary
        run: python3 tools/replacement_gates.py
      - name: Test replacement gate summary generator
        run: python3 -m unittest tools/test_replacement_gates.py
      - name: Test the repository tools and their checked-in outputs
        shell: bash
        run: |
          set -euo pipefail
          # test_aur_tag.py is left out: it reads git tags, which this checkout does not fetch.
          for name in ai_gauntlet_baseline applet_docs check_large_files check_latency_ratio example_lint migration_tags model_eval_report omarchy_port_features omarchy_port_report omarchy_sample omarchy_upstream_map package_deps repair_bench token_cost ubuntu_inventory workers_sdk; do
            echo "::group::tools/test_$name.py"
            python3 -m unittest "tools/test_$name.py"
            echo "::endgroup::"
          done
          # Generated or ratcheted files must match what the tools produce today.
          python3 tools/applet_docs.py --check
          python3 tools/omarchy_sample.py --check
          python3 tools/example_lint.py
      - name: Clippy every feature combination
        shell: bash
        run: |
          set -euo pipefail
          for args in "--no-default-features" \
                      "--no-default-features --features graph" \
                      "--no-default-features --features screens" \
                      "--no-default-features --features records" \
                      "--no-default-features --features tooling" \
                      "--no-default-features --features module-tools" \
                      "--no-default-features --features agent-advisory" \
                      "--no-default-features --features model" \
                      "--no-default-features --features tui" \
                      "--no-default-features --features desktop" \
                      "--no-default-features --features dap" \
                      "--no-default-features --features remote" \
                      "--no-default-features --features live" \
                      "--no-default-features --features lsp" \
                      ""; do
            echo "::group::cargo clippy $args"
            # shellcheck disable=SC2086
            cargo clippy --locked $args --all-targets -- -D warnings
            echo "::endgroup::"
          done
      - name: Install Bubblewrap for Linux sandbox tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
      - name: Check the model-only build and helper environment
        working-directory: ${{ env.NGS_SRC || github.workspace }}
        run: cargo test --locked --no-default-features --features model --test model_env_minimize
      - name: Test the core and default builds
        working-directory: ${{ env.NGS_SRC || github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          # --lib --tests does not build [[bin]] targets, and the listener tests
          # look for target/debug/native-fixture next to the test binary.
          cargo build --locked --features test-fixtures --bin native-fixture
          cargo test --locked --no-default-features --features test-fixtures --lib --tests
          cargo test --locked --features test-fixtures --lib --tests
      - name: Measure Linux required-sandbox spawn overhead
        if: runner.os == 'Linux'
        run: >-
          cargo test --locked --release --features test-fixtures --lib
          platform::sandbox::tests::required_sandbox_100_spawn_overhead_and_probe_frequency
          -- --ignored --nocapture --test-threads=1
      - name: Test standalone model feature
        working-directory: ${{ env.NGS_SRC || github.workspace }}
        run: cargo test --locked --no-default-features --features model --lib --tests
      - name: Verify daemon fallback across Linux namespaces
        if: runner.os == 'Linux'
        env:
          EXECUTE_REQUIRE_NAMESPACE_TESTS: "1"
        run: cargo test --locked --test daemon_cli linux_ -- --nocapture
      - name: Detach trusted Windows CI volume
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:NGS_TEST_VHD_PATH -or -not (Test-Path -LiteralPath $env:NGS_TEST_VHD_PATH)) { exit 0 }
          $diskpart = Join-Path $env:RUNNER_TEMP "ngs-ci-cleanup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.diskpart"
          $commands = @("select vdisk file=`"$env:NGS_TEST_VHD_PATH`"", "detach vdisk", "exit")
          [System.IO.File]::WriteAllLines($diskpart, $commands, [System.Text.Encoding]::ASCII)
          & "$env:WINDIR\System32\diskpart.exe" /s $diskpart
          if ($LASTEXITCODE -ne 0) { Write-Warning "Could not detach the trusted Windows CI volume" }
          Remove-Item -LiteralPath $env:NGS_TEST_VHD_PATH -Force -ErrorAction SilentlyContinue
  workflows:
    name: Release contracts and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tests/releases.py
      - run: python3 -O tests/releases.py
      - name: Every unsafe block and impl has a SAFETY comment, on every platform
        run: python3 tools/check_unsafe.py
      - name: Install pinned workflow validator
        run: GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$RUNNER_TEMP/actionlint/actionlint" -color'
  linux-budgets:
    # Size, latency, hot-path and port budgets for the default Linux build. A job of its
    # own, so a failing test elsewhere no longer skips these checks.
    name: Linux budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: jq --version
      - name: Prove latency gate rejects a 20% startup regression
        run: python3 tests/test_latency_budget_regression.py
      - name: Prove Linux latency gate reports independent child RSS
        run: python3 tests/test_latency_budget_rss.py
      - name: Check Linux default release binary size
        id: linux_binary_size
        run: |
          cargo build --locked --release --bin execute
          python3 tools/check_binary_size.py target/release/execute tools/linux-binary-budget.json
      # Temporary diagnostic for the binary-size boundary: same-runner paired
      # comparison tells real growth apart from runner/toolchain noise without
      # moving the absolute ceiling. Remove once the gate is green and the
      # retained samples have justified a re-budget.
      - name: Diagnose failed binary size with same-runner paired comparison
        id: paired_binary_size
        if: failure() && steps.linux_binary_size.outcome == 'failure' && ((github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000') || github.event_name == 'pull_request')
        continue-on-error: true
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
          fi
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid base revision: $BASE_SHA" >&2
            exit 1
          fi
          parent_worktree="$RUNNER_TEMP/binary-size-parent-src"
          candidate_bin="$RUNNER_TEMP/execute-size-candidate"
          baseline_bin="$RUNNER_TEMP/execute-size-baseline"
          if [[ ! -x target/release/execute ]]; then
            echo "target/release/execute is missing (build failed); skipping paired binary-size diagnosis to preserve the original failure." >&2
            exit 0
          fi
          cp target/release/execute "$candidate_bin"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          worktree_added=0
          cleanup() {
            status=$?
            trap - EXIT
            if (( worktree_added )); then
              git worktree remove --force "$parent_worktree" || status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          git worktree add --detach "$parent_worktree" "$BASE_SHA"
          worktree_added=1
          CARGO_TARGET_DIR="$RUNNER_TEMP/binary-size-paired-target" cargo build --locked --release --manifest-path "$parent_worktree/Cargo.toml" --bin execute
          cp "$RUNNER_TEMP/binary-size-paired-target/release/execute" "$baseline_bin"
          python3 tools/compare_binary_size.py \
            --baseline "$baseline_bin" \
            --candidate "$candidate_bin" \
            --baseline-label "$BASE_SHA" \
            --candidate-label "$HEAD_SHA" \
            --baseline-revision "$BASE_SHA" \
            --candidate-revision "$HEAD_SHA" \
            --json-out target/paired-binary-size.json
      - name: Save paired binary-size samples
        if: always() && steps.paired_binary_size.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-binary-size-paired-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/paired-binary-size.json
          # warn, not error: a missing sample must never mask the gate failure above.
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
      - name: Compare Omarchy ports with their Bash originals
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x target/release/execute ]]; then
            echo "target/release/execute is missing (earlier build likely failed); skipping port comparison to preserve the original failure." >&2
            exit 0
          fi
          python3 tools/port_compare.py --binary target/release/execute
      - name: Test paired latency comparison tool
        if: success() || failure()
        run: python3 tools/test_paired_latency.py
      - name: Test paired binary-size comparison tool
        if: success() || failure()
        run: python3 tools/test_compare_binary_size.py
      - name: Test existing latency budget limits
        if: success() || failure()
        run: python3 -m unittest tests/test_latency_budget_limits.py -v
      - name: Test latency budget regeneration contracts
        if: success() || failure()
        run: python3 -m unittest tests/test_regenerate_latency_budget.py -v
      - name: Test benchmark manifest command selection
        if: success() || failure()
        run: python3 -m unittest tests/test_bench_budget.py -v
      - name: Measure Linux latency budget
        id: linux_latency
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x target/release/execute ]]; then
            echo "target/release/execute is missing (earlier build likely failed); skipping latency measurement to preserve the original failure." >&2
            exit 0
          fi
          python3 tools/check_latency.py target/release/execute tools/linux-latency-budget.json --manifest-dir manifests --require-rss --json-out target/linux-latency-samples.json
      - name: Save Linux latency samples
        if: always() && (steps.linux_latency.outcome == 'success' || steps.linux_latency.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-latency-samples-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/linux-latency-samples.json
          # warn, not error: a crash before --json-out must not mask the gate failure.
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
      - name: Compare failed latency budget with same-runner paired comparison
        id: paired_latency
        if: failure() && steps.linux_latency.outcome == 'failure' && ((github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000') || github.event_name == 'pull_request')
        continue-on-error: true
        env:
          PUSH_BASE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
          fi
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid base revision: $BASE_SHA" >&2
            exit 1
          fi
          parent_worktree="$RUNNER_TEMP/latency-parent-src"
          candidate_bin="$RUNNER_TEMP/execute-candidate"
          baseline_bin="$RUNNER_TEMP/execute-baseline"
          if [[ ! -x target/release/execute ]]; then
            echo "target/release/execute is missing (build failed); skipping paired latency diagnosis to preserve the original failure." >&2
            exit 0
          fi
          cp target/release/execute "$candidate_bin"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          worktree_added=0
          cleanup() {
            status=$?
            trap - EXIT
            if (( worktree_added )); then
              git worktree remove --force "$parent_worktree" || status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          git worktree add --detach "$parent_worktree" "$BASE_SHA"
          worktree_added=1
          CARGO_TARGET_DIR="$RUNNER_TEMP/latency-paired-target" cargo build --locked --release --manifest-path "$parent_worktree/Cargo.toml" --bin execute
          cp "$RUNNER_TEMP/latency-paired-target/release/execute" "$baseline_bin"
          baseline_manifests="$parent_worktree/manifests"
          candidate_manifests="$GITHUB_WORKSPACE/manifests"
          baseline_manifest_args=(--baseline-manifest-dir "$baseline_manifests")
          candidate_manifest_args=(--candidate-manifest-dir "$candidate_manifests")
          if [[ ! -d "$baseline_manifests" ]]; then
            echo "baseline manifests not present at $BASE_SHA; falling back to candidate manifests for both sides." >&2
            baseline_manifest_args=(--manifest-dir "$candidate_manifests")
            candidate_manifest_args=()
          fi
          python3 tools/compare_latency.py \
            --baseline "$baseline_bin" \
            --candidate "$candidate_bin" \
            --baseline-label "$BASE_SHA" \
            --candidate-label "$HEAD_SHA" \
            "${baseline_manifest_args[@]}" \
            "${candidate_manifest_args[@]}" \
            --json-out target/paired-latency.json
      - name: Save paired latency samples
        if: always() && steps.paired_latency.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-latency-paired-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/paired-latency.json
          # warn, not error: a missing sample must never mask the gate failure above.
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
      - name: Measure hot-path benchmarks
        if: success() || failure()
        shell: bash
        env:
          BENCH_BASELINE_SHA: 35483ce354f9481cbe2c6878d48e9f48b37d5a5c
        run: |
          set -euo pipefail
          if [[ ! -x target/release/execute ]]; then
            echo "target/release/execute is missing (earlier build likely failed); skipping benchmarks to preserve the original failure." >&2
            exit 0
          fi
          if ! [[ "$BENCH_BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid bench baseline revision: $BENCH_BASELINE_SHA" >&2
            exit 1
          fi
          baseline_src="$RUNNER_TEMP/parallel-each-baseline-src"
          baseline_target="$RUNNER_TEMP/parallel-each-baseline-target"
          git fetch --no-tags --depth=1 origin "$BENCH_BASELINE_SHA"
          worktree_added=0
          cleanup() {
            status=$?
            trap - EXIT
            if (( worktree_added )); then
              git worktree remove --force "$baseline_src" || status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT
          git worktree add --detach "$baseline_src" "$BENCH_BASELINE_SHA"
          worktree_added=1
          CARGO_TARGET_DIR="$baseline_target" cargo build --locked --release --manifest-path "$baseline_src/Cargo.toml" --bin execute
          python3 tools/bench_budget.py target/release/execute tools/linux-bench-budget.json \
            --baseline-binary "$baseline_target/release/execute"
      - name: Check Linux minimal build size and tests
        if: success() || failure()
        run: |
          cargo build --locked --release --bin execute --no-default-features
          python3 tools/check_binary_size.py target/release/execute tools/linux-minimal-binary-budget.json
          cargo test --locked --no-default-features --lib
  unix:
    name: Unix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: jq --version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: editors/vscode
      - name: Verify inherited stdio remains blocking
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test --locked --features test-fixtures --test inherited_stdio_nonblocking
      # On ubuntu-24.04, Clippy runs in the unix-clippy job below with its
      # own timeout budget (#758); every other make check step still runs
      # here. The macos-15 leg is unchanged and runs the full make check.
      - name: Run make check without Clippy (Clippy job covers it)
        if: matrix.os == 'ubuntu-24.04'
        run: make check-no-clippy
      - name: Run make check
        if: matrix.os != 'ubuntu-24.04'
        run: make check
      - run: make unix-smoke
      - run: make proof-smoke
      - run: npm run package
        working-directory: editors/vscode
        env:
          EXECUTE_TEST_BINARY: ${{ github.workspace }}/target/release/execute
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-proofs-${{ matrix.os }}
          path: |
            target/unix-matrix.json
            target/proof-smoke.json
          if-no-files-found: warn
          retention-days: 14
  unix-clippy:
    # The full-feature Clippy pass from make check / rust-check, split out
    # of the Unix ubuntu-24.04 leg so it no longer shares that leg's
    # 30-minute budget with the full test suite (#758). Clippy alone was
    # still running when that budget expired, so this job gets the same
    # 60 minutes as the feature-matrix Clippy job. The macos-15 leg of the
    # unix job still runs Clippy as part of its full make check.
    name: Unix Clippy (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run Clippy (full feature set)
        run: make clippy-check
  windows:
    name: Native Windows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Restrict the manifests directory to trusted writers
        shell: pwsh
        run: |
          # The runner checkout grants BUILTIN\Users and Authenticated Users write
          # rights, which the trusted-input gate refuses. Keep only the runner user,
          # SYSTEM and Administrators with write access.
          $userSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $manifests = Join-Path $env:GITHUB_WORKSPACE "manifests"
          & "$env:WINDIR\System32\icacls.exe" $manifests /inheritance:r `
            /grant:r "*$($userSid):(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F"
          if ($LASTEXITCODE -ne 0) { throw "Could not restrict the manifests directory" }
          # Reset the contents to inherit the restricted directory. Applying /grant:r
          # recursively would leave the files with no access entries at all.
          & "$env:WINDIR\System32\icacls.exe" "$manifests\*" /reset /T /C
          if ($LASTEXITCODE -ne 0) { throw "Could not reset the manifests contents" }
      - name: Prepare trusted Windows test and build roots
        shell: pwsh
        run: |
          # The trusted-input gate checks every ancestor. ProgramData and the
          # workspace have runner ACLs that grant foreign write rights, so
          # use a fresh NTFS volume whose root is the trust boundary.
          $vhd = Join-Path $env:RUNNER_TEMP "ngs-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.vhdx"
          "NGS_TEST_VHD_PATH=$vhd" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $letters = @('Z','Y','X','W','V','U','T','S','R','Q','P','O','N','M','L','K','J','I','H','G','F','E')
          $letter = $letters | Where-Object { -not (Get-PSDrive -Name $_ -ErrorAction SilentlyContinue) } | Select-Object -First 1
          if (-not $letter) { throw "No free drive letter for the trusted Windows CI volume" }
          $diskpart = Join-Path $env:RUNNER_TEMP "ngs-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.diskpart"
          $commands = @(
            "create vdisk file=`"$vhd`" maximum=32768 type=expandable",
            "select vdisk file=`"$vhd`"",
            "attach vdisk",
            "create partition primary",
            "format fs=ntfs quick label=NGSCI",
            "assign letter=$letter",
            "exit"
          )
          [System.IO.File]::WriteAllLines($diskpart, $commands, [System.Text.Encoding]::ASCII)
          & "$env:WINDIR\System32\diskpart.exe" /s $diskpart
          if ($LASTEXITCODE -ne 0) { throw "Could not create the trusted Windows CI volume" }
          $driveRoot = $letter + ":" + [System.IO.Path]::DirectorySeparatorChar
          $userSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & "$env:WINDIR\System32\icacls.exe" $driveRoot /setowner "*$userSid"
          if ($LASTEXITCODE -ne 0) { throw "Could not set the trusted Windows CI volume owner" }
          & "$env:WINDIR\System32\icacls.exe" $driveRoot /inheritance:r `
            /grant:r "*$($userSid):(OI)(CI)F" "*S-1-5-18:(OI)(CI)F" "*S-1-5-32-544:(OI)(CI)F"
          if ($LASTEXITCODE -ne 0) { throw "Could not secure the trusted Windows CI volume" }
          # /inheritance:r keeps explicit ACEs the format wrote. Those grant Users and
          # Authenticated Users write rights that every child temp directory inherits,
          # so the trusted-input gate refuses the test temp roots. Remove them.
          & "$env:WINDIR\System32\icacls.exe" $driveRoot /remove:g "*S-1-5-32-545" "*S-1-5-11" "*S-1-1-0"
          if ($LASTEXITCODE -ne 0) { throw "Could not remove foreign write rights from the trusted Windows CI volume" }
          $target = Join-Path $driveRoot "target"
          $temp = Join-Path $driveRoot "temp"
          New-Item -ItemType Directory -Path $target, $temp | Out-Null
          "CARGO_TARGET_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Tests load the repository's own manifests folder, and the gate checks every
          # ancestor of it. The checkout lives under a runner directory that grants
          # Authenticated Users modify rights, which no ACL change on the manifests
          # folder alone can fix. Build and test from a copy on the trusted volume.
          $source = Join-Path $driveRoot "src"
          & "$env:WINDIR/System32/robocopy.exe" $env:GITHUB_WORKSPACE $source /E /XD target /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw "Could not copy the checkout to the trusted Windows CI volume" }
          $global:LASTEXITCODE = 0
          "NGS_SRC=$source" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The build target lives on an ephemeral VHD that is detached before
          # post-job cache saving; keep the registry cache only.
          cache-targets: false
      - run: cargo fmt --check
        working-directory: ${{ env.NGS_SRC }}
      - run: rustfmt --edition 2021 --check src/runtime/shared.rs
        working-directory: ${{ env.NGS_SRC }}
      - name: Audit native-tool contracts and bundled index freshness
        # Pure-Python static audit: needs no build, so it runs even when the
        # bundled manifest index is stale (coordinator regenerates it).
        shell: bash
        working-directory: ${{ env.NGS_SRC }}
        run: python tests/native_tool_contracts.py
      - run: cargo clippy --locked --features full,test-fixtures --target ${{ matrix.target }} --all-targets -- -D warnings
        working-directory: ${{ env.NGS_SRC }}
      - run: cargo build --locked --target ${{ matrix.target }} --release --features full,test-fixtures --bins
        working-directory: ${{ env.NGS_SRC }}
      - name: Verify Git for Windows MSYS printf fixture
        shell: pwsh
        working-directory: ${{ env.NGS_SRC }}
        run: |
          $candidates = @(
            (Join-Path $env:ProgramFiles "Git/usr/bin/printf.exe")
            (where.exe printf.exe 2>$null)
          )
          $fixture = $candidates | Where-Object {
            (Test-Path -LiteralPath $_) -and
            (Test-Path -LiteralPath (Join-Path (Split-Path -Parent $_) "msys-2.0.dll"))
          } | Select-Object -First 1
          if (-not $fixture) {
            throw "Git for Windows MSYS printf.exe and sibling msys-2.0.dll are required for the Windows argv regression."
          }
          Write-Host "Verified MSYS printf fixture: $fixture"
      - name: Put MSYS shell tools on PATH for the Unix-ported suites
        shell: pwsh
        working-directory: ${{ env.NGS_SRC }}
        run: |
          "$env:ProgramFiles\Git\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$env:ProgramFiles\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install manifest fixture beside the release test binaries
        shell: pwsh
        working-directory: ${{ env.NGS_SRC }}
        run: |
          $fixture = Join-Path $env:CARGO_TARGET_DIR "${{ matrix.target }}\manifests"
          if (Test-Path $fixture) { Remove-Item $fixture -Recurse -Force }
          Copy-Item -Path manifests -Destination $fixture -Recurse

      - run: cargo test --locked --target ${{ matrix.target }} --release --features full,test-fixtures --test windows_native --test parallel_each_windows --test worker_backend_windows --test applet_executable_pinning_windows --test named_background_jobs --test models --test opt_manifest_regressions --test check_json --test manifest_catalog --test prompt_inputs --test child_env_minimize_windows --test lane_w1_regressions --test lane_o_handoff --test checkpoint_resolve_elements --test crash_injection --test robustness --test applet_boundaries_bench --test adversarial --test cache_dependencies --test cache_security --test child_env_minimize --test cli --test conditions --test cpu --test direct_commands --test github_actions --test graph_composition_acceptance --test graph_result_events --test inspection --test invocation_io --test lane_a_cli --test lane_o_init --test loops --test manifest_catalog_cli --test model_cli --test model_control --test native_status --test opt_child_wakeup --test opt_diagnostics_poll --test opt_local_child_observer --test opt_services_checkpoint_listener --test opt_small_input --test opt_stdin_prefill --test process_inputs --test program_inputs --test program_module_accounting --test resume --test reusable_programs --test security_dataflow_runtime --test security_redaction --test service_environment --test stdin --test streaming --test structured_json --test terminal_output_escape --test timeout --test typed_contracts --test ui --test worker_backend -- --test-threads=1
        working-directory: ${{ env.NGS_SRC }}
      - run: cargo test --locked --target ${{ matrix.target }} --release --features full,test-fixtures --test repair_from_record recorded_failure_repairs_and_resumes_without_repeating_completed_effects_portable -- --test-threads=1
        working-directory: ${{ env.NGS_SRC }}
      - run: cargo test --locked --target ${{ matrix.target }} --release --features full,test-fixtures --test repair_from_record repair_and_resume_refuse_an_oversize_executable_without_rerunning -- --test-threads=1
        working-directory: ${{ env.NGS_SRC }}
      - run: cargo test --locked --target ${{ matrix.target }} --release --features full,test-fixtures --lib -- --test-threads=1
        working-directory: ${{ env.NGS_SRC }}
      - name: Detach trusted Windows CI volume
        if: always()
        shell: pwsh
        run: |
          if (-not $env:NGS_TEST_VHD_PATH -or -not (Test-Path -LiteralPath $env:NGS_TEST_VHD_PATH)) { exit 0 }
          $diskpart = Join-Path $env:RUNNER_TEMP "ngs-ci-cleanup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.diskpart"
          $commands = @("select vdisk file=`"$env:NGS_TEST_VHD_PATH`"", "detach vdisk", "exit")
          [System.IO.File]::WriteAllLines($diskpart, $commands, [System.Text.Encoding]::ASCII)
          & "$env:WINDIR\System32\diskpart.exe" /s $diskpart
          if ($LASTEXITCODE -ne 0) { Write-Warning "Could not detach the trusted Windows CI volume" }
          Remove-Item -LiteralPath $env:NGS_TEST_VHD_PATH -Force -ErrorAction SilentlyContinue
