name: Platform matrix
on:
  schedule:
    - cron: '29 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  msrv:
    name: Minimum supported Rust (1.89.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-1.89.0
      - name: Check the library, binaries and tests on the minimum version
        run: cargo check --locked --features full --lib --bins --tests
  linux-arm64:
    name: Linux arm64 (library tests)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux-arm64
      - name: Library tests
        run: cargo test --locked --features full --lib -- --test-threads=1
      - name: Release binary runs
        run: |
          cargo build --locked --release --features full --bin execute
          target/release/execute --version
  alpine-static:
    name: Static musl build on Alpine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build a static binary inside Alpine and run it
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -eu -c '
            apk add --no-cache build-base curl ca-certificates file
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1
            . "$HOME/.cargo/env"
            RUSTFLAGS="-C target-feature=+crt-static" \
              cargo build --locked --profile dist --features full --bin execute --target x86_64-unknown-linux-musl
            file target/x86_64-unknown-linux-musl/dist/execute | grep -q "static" || { echo "not a static binary"; exit 1; }
            target/x86_64-unknown-linux-musl/dist/execute --version
            cd /tmp && printf "%s\n" "run printf with message \"alpine\"" > smoke.program
            /src/target/x86_64-unknown-linux-musl/dist/execute run smoke.program --manifest-dir /src/manifests
          '
