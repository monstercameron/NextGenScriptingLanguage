name: Execute vs bash
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bash-compare-${{ github.sha }}
  cancel-in-progress: false
jobs:
  compare:
    name: Compare with bash and dash (${{ matrix.os }}, ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        # release: the default build a distro would ship. opt-s: the same with
        # opt-level "s". musl: a static release binary. musl-min: static, built
        # with the size-first min profile (opt-level "z", panic abort).
        # core: --no-default-features (no graph, screens, records or tooling).
        variant: [release, opt-s, musl, musl-min, core, core-musl-min]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.variant }}
      - run: sudo apt-get install -y --no-install-recommends time strace musl-tools valgrind
      - name: Install perf for instruction counts (best effort)
        run: sudo apt-get install -y --no-install-recommends linux-tools-common linux-tools-generic || true
      - name: Check benchmark workload contracts
        run: python3 -m unittest tests/test_bash_compare.py -v
      - name: Check stored Execute/Bash ratio regression gate
        run: python3 -m unittest tests/test_bash_ratio_regression.py -v
      - name: Check CPU-bound instruction regression gate
        run: python3 -m unittest tests/test_instruction_regression.py -v
      - name: Build
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          musl="$(uname -m)-unknown-linux-musl"
          case "$VARIANT" in
            release) cargo build --locked --release --bin execute; bin=target/release/execute ;;
            opt-s) CARGO_PROFILE_RELEASE_OPT_LEVEL=s cargo build --locked --release --bin execute; bin=target/release/execute ;;
            musl) rustup target add "$musl"; cargo build --locked --release --bin execute --target "$musl"; bin="target/$musl/release/execute" ;;
            musl-min) rustup target add "$musl"; cargo build --locked --profile min --bin execute --target "$musl"; bin="target/$musl/min/execute" ;;
            core) cargo build --locked --release --bin execute --no-default-features; bin=target/release/execute ;;
            core-musl-min) rustup target add "$musl"; cargo build --locked --profile min --bin execute --no-default-features --target "$musl"; bin="target/$musl/min/execute" ;;
          esac
          echo "EXECUTE_BIN=$bin" >> "$GITHUB_ENV"
      - run: bash --version | head -1 && jq --version && ls -l /usr/bin/dash "$EXECUTE_BIN"
      - name: Compare
        timeout-minutes: 5
        # Counter-free on purpose: instruction counting (cachegrind especially)
        # would perturb these wall-time medians and spend the 285-second
        # budget. Real instruction counts come from the focused gate pair
        # below, which prints its own table.
        run: python3 tools/bash_compare.py "$EXECUTE_BIN" --manifest-dir manifests --max-runtime-seconds 285 --instructions-backend none --json-out target/bash-compare.json
      # Where the startup time goes, for the optimisation lanes: syscalls, the
      # dynamic loader's own cost, and the binary's sections.
      - name: Profile startup
        if: matrix.variant == 'release'
        run: |
          echo 'use value ""' > "$RUNNER_TEMP/startup.program"
          program=("$EXECUTE_BIN" run "$RUNNER_TEMP/startup.program")
          ldd "$EXECUTE_BIN"
          size -A "$EXECUTE_BIN" | sort -k2 -n | tail -n 12
          strace -f -c -o "$RUNNER_TEMP/strace-count.txt" "${program[@]}"
          cat "$RUNNER_TEMP/strace-count.txt"
          strace -f -r -o "$RUNNER_TEMP/strace-timeline.txt" "${program[@]}"
          cat "$RUNNER_TEMP/strace-timeline.txt"
          LD_DEBUG=statistics "${program[@]}" 2>&1 | head -n 20
          strace -f -c -o "$RUNNER_TEMP/bash-count.txt" bash --norc --noprofile -c :
          tail -n 4 "$RUNNER_TEMP/bash-count.txt"
      - name: Measure CPU-bound instructions twice (same-runner gate pair)
        timeout-minutes: 10
        run: |
          # Focused instruction runs over the eight gated CPU-bound scenarios
          # only, pinned to cachegrind: deterministic counts from its virtual
          # CPU with no PMU or privileges required on hosted runners. Two
          # back-to-back reports on this same runner form the gate pair, so a
          # regression verdict never depends on cross-runner numbers. The
          # run-a/run-b revision suffixes distinguish the two measurements of
          # the same binary (the gate requires distinct revisions; provenance
          # hashes stay identical, which the gate checks).
          opts="--manifest-dir manifests --max-runtime-seconds 285 --runs 3 --warmup 0 --instruction-repeats 2 --instructions-backend cachegrind"
          only="--only builtin_loop --only text_upper --only json_get --only csv_parse --only read_10k_lines --only suffix_strip --only here_string --only text_substitution"
          # shellcheck disable=SC2086
          python3 tools/bash_compare.py "$EXECUTE_BIN" $opts $only --json-out target/instructions-run-a.json
          # shellcheck disable=SC2086
          python3 tools/bash_compare.py "$EXECUTE_BIN" $opts $only --json-out target/instructions-run-b.json
          # jq is verified above; the gate requires distinct revisions while
          # provenance hashes stay identical, which the gate checks.
          for tag in run-a run-b; do
            tmp="$(mktemp)"
            jq --arg tag "$tag" '.metadata.source_revision += "-\($tag)"' "target/instructions-$tag.json" > "$tmp"
            mv "$tmp" "target/instructions-$tag.json"
          done
      - name: Gate CPU-bound instructions (same-runner pair, fail-closed)
        run: |
          # Fail-closed: every nonzero exit below fails this job. The real
          # gate compares the two same-runner reports (exit 0 means the pair
          # is stable within +2%); the canary then requires the wired gate to
          # fail a synthetic +3% regression on the real report (exit 0 means
          # caught). Exit 2 (inconclusive: no gated counts, incomparable
          # backends) is a job failure, never acceptance green.
          set -e
          python3 tools/check_instruction_regression.py target/instructions-run-a.json target/instructions-run-b.json --fail-closed --require-provenance
          python3 tools/check_instruction_regression.py --canary target/instructions-run-b.json --canary-percent 3
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "## Instruction gate" >> "$GITHUB_STEP_SUMMARY"
            echo "Same-runner cachegrind pair stable within +2%, and the gate caught a synthetic +3% regression on the measured report." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bash-compare-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            target/bash-compare.json
            target/instructions-run-a.json
            target/instructions-run-b.json
          if-no-files-found: warn
          retention-days: 30
