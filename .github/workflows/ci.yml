name: Rust checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: jq --version
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 tests/unix_bench.py
      - run: cargo build --locked --release
      - run: python3 tests/replacement_proofs.py
        env:
          EXECUTE_PROOF_BINARY: target/release/execute
      - run: python3 benchmarks/replacement_proofs.py --binary target/release/execute --stream-bytes 1048576 --lifecycle-repetitions 1 --report proof-smoke.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: editors/vscode
      - run: npm run package
        working-directory: editors/vscode
        env:
          EXECUTE_TEST_BINARY: ${{ github.workspace }}/target/release/execute
