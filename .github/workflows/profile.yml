name: Profile hot paths
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    name: perf and strace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: profile
      # The release profile strips symbols; keep them (and frame pointers) for perf.
      - name: Build a symbolized release binary
        env:
          CARGO_PROFILE_RELEASE_STRIP: 'false'
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          RUSTFLAGS: -C force-frame-pointers=yes
        run: cargo build --locked --release --bin execute
      - name: Install perf and strace
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends strace linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y --no-install-recommends strace linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
      - name: Prepare scenarios
        run: |
          d="$RUNNER_TEMP/p"; mkdir -p "$d"
          python3 - "$d" <<'PY'
          import sys, pathlib
          d = pathlib.Path(sys.argv[1])
          line = b"the quick brown fox jumps over the lazy dog 0123456789\n"
          (d / "text.input").write_bytes(line * (1_000_000 // len(line)))
          items = ",".join(f'{{"id":{n},"name":"item-{n}","tags":["a","b"]}}' for n in range(5000))
          (d / "json.input").write_text(f'{{"a":{{"b":[{items}]}},"meta":{{"count":5000}}}}')
          (d / "startup.program").write_text('use value ""\n')
          (d / "one.program").write_text('run "cat" with arguments ["/dev/null"]\n')
          (d / "upper.program").write_text("read from stdin as text\nrun text.upper with text text\n")
          (d / "json.program").write_text('read from stdin\nthen parse json as document\nrun json.get with document document and pointer "/meta/count"\n')
          PY
      - name: Profile
        run: |
          d="$RUNNER_TEMP/p"; bin="$PWD/target/release/execute"
          profile() {
            name="$1" program="$2" input="$3"
            echo "::group::$name strace"
            strace -f -c -o "$d/$name.strace" "$bin" run "$d/$program" < "$input" > /dev/null
            cat "$d/$name.strace"
            strace -f -e trace=read,write,mmap,munmap,brk,mremap -o "$d/$name.io" "$bin" run "$d/$program" < "$input" > /dev/null
            echo "largest and most frequent I/O and memory calls:"; awk '{print $2}' "$d/$name.io" | cut -d'(' -f1 | sort | uniq -c | sort -rn | head
            grep -E 'write\(1' "$d/$name.io" | head -n 5
            echo "::endgroup::"
            echo "::group::$name perf"
            # Repeat the run so the sample count is meaningful.
            perf record -q -F 20000 -g -o "$d/$name.data" -- bash -c "for i in \$(seq 50); do '$bin' run '$d/$program' < '$input' > /dev/null; done"
            perf report -i "$d/$name.data" --stdio --no-children -g none --sort dso,symbol --percent-limit 0.5 2>/dev/null | grep -v "^#" | grep -v "^$" | head -n 45
            echo "::endgroup::"
          }
          profile startup startup.program /dev/null
          profile one one.program /dev/null
          profile upper upper.program "$d/text.input"
          profile json json.program "$d/json.input"
