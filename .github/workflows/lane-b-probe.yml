name: lane-b probe
# Temporary verification workflow for branch lane-b/port-check-stream only. Delete with the branch.
on:
  push:
    branches: [lane-b/port-check-stream]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --features full --all-targets -- -D warnings
      - name: Full test suite
        run: cargo test --locked --features full --release --no-fail-fast -- --test-threads=1
