[package]
name = "execute"
version = "0.9.0-dev"
edition = "2021"
default-run = "execute"
description = "Readable Unix workflows with declarative applets and direct pipes"
license = "MIT"

[lib]
name = "flow"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
signal-hook = "0.3"
chrono = "0.4"
ratatui = "0.29"
crossterm = "0.28"
unicode-width = "0.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true


[patch.crates-io]
iana-time-zone = { path = "vendor/iana-time-zone" }
