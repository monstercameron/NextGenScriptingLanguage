name: Package validation
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  packages:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: package-${{ matrix.target }}
      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools rpm
      - run: python3 tests/releases.py
      - run: cargo build --locked --release --target '${{ matrix.target }}' --bins
      - name: Build archives and Linux packages
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          extra=()
          if [[ "$RUNNER_OS" == Linux ]]; then extra+=(--linux-packages); fi
          python3 tools/package.py --target "$BUILD_TARGET" --binaries "target/$BUILD_TARGET/release" "${extra[@]}"
      - name: Extract and run archive
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          archives = list(pathlib.Path('dist').glob('*.zip')) + list(pathlib.Path('dist').glob('*.tar.gz'))
          if len(archives) != 1: raise SystemExit('expected one native archive')
          subprocess.run(['python3', 'tools/package_smoke.py', '--archive', str(archives[0])], check=True)
          PY
      - name: Install DEB on ephemeral runner
        if: runner.os == 'Linux'
        run: |
          sudo dpkg -i dist/*.deb
          python3 tools/package_smoke.py --root / --system
      - name: Inspect and extract RPM payload
        if: runner.os == 'Linux'
        run: |
          rpm -qpi dist/*.rpm
          mkdir -p target/rpm-smoke
          rpm2cpio dist/*.rpm | (cd target/rpm-smoke && cpio -idm --quiet)
          python3 tools/package_smoke.py --root target/rpm-smoke --system
      - name: Install RPM in native Fedora container
        if: runner.os == 'Linux'
        run: |
          docker run --rm --network none -v "$PWD/dist:/packages:ro" fedora:43 /bin/sh -eu -c '
            rpm -i /packages/*.rpm
            execute --version
            execute model --help
            execute-applet --version
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ matrix.target }}
          path: dist
      - name: Install Flatpak tools and runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Build and execute sandboxed bundle
        env:
          FLATPAK_ARCH: ${{ matrix.arch }}
        run: dbus-run-session -- python3 tools/flatpak.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/*.flatpak
          if-no-files-found: error
          retention-days: 14
