# cargo-deny policy: advisories, licenses, bans, and sources. Run as
# `cargo deny --all-features check` in the security workflow. The graph covers the
# product feature set (`full`), so the TUI and model dependencies are checked too.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# A new duplicate version fails the build. The entries below are the duplicates that
# exist today; each comes from two dependency lines that cannot yet be unified.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = true
skip = [
    { crate = "signal-hook@0.3.18", reason = "crossterm and signal-hook-mio still require 0.3 for terminal event handling" },
    { crate = "signal-hook@0.4.5", reason = "execute directly uses 0.4; crossterm has not yet moved from 0.3" },
    { crate = "getrandom@0.2.17", reason = "ring 0.17 through rustls and ureq (the HTTP client); execute uses getrandom 0.4 directly" },
    { crate = "getrandom@0.4.3", reason = "execute's direct dependency (the per-user what-if key)" },
    { crate = "syn@2.0.119", reason = "strum_macros through ratatui 0.29 (tui feature); accepted until ratatui is upgraded" },
    { crate = "syn@3.0.9", reason = "darling and instability through ratatui 0.29 (tui feature); accepted until ratatui is upgraded" },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17 on Windows through rustls and ureq" },
    { crate = "windows-sys@0.61.2", reason = "execute's direct Windows dependency (Win32 APIs)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
