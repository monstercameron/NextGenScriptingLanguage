[package]
name = "execute"
version = "0.9.0-rc.5"
edition = "2021"
default-run = "execute"
description = "Readable Unix workflows with declarative applets and direct pipes"
license = "MIT"
repository = "https://github.com/monstercameron/NextGenScriptingLanguage"
homepage = "https://monstercameron.github.io/NextGenScriptingLanguage/"
readme = "README.md"
keywords = ["scripting", "unix", "pipeline", "interpreter", "automation"]
categories = ["command-line-utilities"]

[lib]
name = "flow"

[dependencies]
anyhow = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
memchr = "2.8.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
url = "2.5.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
libc = "0.2"
signal-hook = "0.3"
chrono = "0.4"
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
unicode-width = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }
mio = { version = "1.2.4", features = ["net", "os-poll"], optional = true }

[target.'cfg(windows)'.dependencies]
ureq = { version = "=3.4.2", default-features = false, features = ["native-tls"], optional = true }
mio = { version = "1.2.4", features = ["net", "os-poll"], optional = true }
ctrlc = "3.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Memory"] }

[features]
# The default build is lean: no terminal UI and no model helper. `full` is the
# product feature set; shipped binaries, release packages, and the test suite build
# with `--features full`. Disabling `tui` or `model` drops the code each one selects.
default = []
full = ["tui", "model", "desktop", "dap", "remote", "live", "lsp"]
# The terminal UI shows live session state, so it implies the live control plane.
tui = ["live", "dep:ratatui", "dep:crossterm", "dep:unicode-width"]
# The live control endpoint, `run --control`, and `attach`.
live = []
# The language server behind `execute lsp`: editor completions, hovers, and diagnostics.
lsp = []
# The model helper and the remote backend share the HTTP client, so each enables it.
model = ["dep:ureq"]
remote = ["dep:ureq", "dep:mio"]
# Quickshell desktop renderer nodes and the DAP adapter. Lean builds refuse both with a clear error.
desktop = []
dap = []
# Test-only fault injection for the crash-consistency tests; never enabled by default.
failpoints = []
# Fuzz entry points (src/fuzz_entry.rs) and the regression replay test; never enabled by default.
fuzzing = ["dap"]

[dev-dependencies]
tempfile = "3"
proptest = "1"

# Fat LTO and one codegen unit: measured on Windows, 9.87 MB -> 9.10 MB stripped, and an
# interpreter-bound loop ran about 4% faster. Build time is about 2 minutes (was 1.5).
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"

# Explicit size-first build; unlike release, this profile does not unwind panics.
# Build with `cargo build --profile min --target x86_64-unknown-linux-musl`.
[profile.min]
inherits = "release"
opt-level = "z"
panic = "abort"

[patch.crates-io]
iana-time-zone = { path = "vendor/iana-time-zone" }

# The helper that runs model adapters; a build without `model` omits it.
[[bin]]
name = "execute-model"
path = "src/bin/execute-model.rs"
required-features = ["model"]

[[example]]
name = "native-fixture"
path = "tests/fixtures/native_fixture.rs"

# Unsafe policy: every unsafe block has a `// SAFETY:` comment, and every unsafe operation
# inside an unsafe fn sits in its own block. CI runs clippy with -D warnings.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
