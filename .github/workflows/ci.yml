name: Native checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  # On main, let a started run finish so every push stream gets complete Unix results;
  # a newer push still replaces a run that is only queued.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  workflows:
    name: Release contracts and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tests/releases.py
      - run: python3 -O tests/releases.py
      - name: Install pinned workflow validator
        run: GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: '"$RUNNER_TEMP/actionlint/actionlint" -color'
  unix:
    name: Unix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-15' && 45 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: jq --version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: editors/vscode
      - run: make check
      - name: Check Linux release binary size
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release --bin execute --features full
          python3 tools/check_binary_size.py target/release/execute tools/linux-binary-budget.json
      - name: Check Linux minimal build size and tests
        if: runner.os == 'Linux'
        run: |
          cargo build --locked --release --bin execute --no-default-features
          python3 tools/check_binary_size.py target/release/execute tools/linux-minimal-binary-budget.json
          cargo test --locked --no-default-features --lib
      - name: Compare Omarchy ports with their Bash originals
        if: runner.os == 'Linux'
        run: python3 tools/port_compare.py --binary target/release/execute
      - name: Measure Linux latency budget
        if: runner.os == 'Linux'
        run: python3 tools/check_latency.py target/release/execute tools/linux-latency-budget.json --manifest-dir manifests
      - run: make unix-smoke
      - run: make proof-smoke
      - run: npm run package
        working-directory: editors/vscode
        env:
          EXECUTE_TEST_BINARY: ${{ github.workspace }}/target/release/execute
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-proofs-${{ matrix.os }}
          path: |
            target/unix-matrix.json
            target/proof-smoke.json
          if-no-files-found: warn
          retention-days: 14
  windows:
    name: Native Windows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: rustfmt --edition 2021 --check src/runtime/shared.rs
      - run: cargo clippy --locked --features full --target ${{ matrix.target }} --all-targets -- -D warnings
      - run: cargo build --locked --target ${{ matrix.target }} --release --features full --bins --example native-fixture
      - run: cargo test --locked --target ${{ matrix.target }} --release --features full --test windows_native --test worker_backend_windows --test named_background_jobs --test models --test opt_manifest_regressions --test check_json --test manifest_catalog -- --test-threads=1
      - run: cargo test --locked --target ${{ matrix.target }} --release --features full --lib -- --test-threads=1
