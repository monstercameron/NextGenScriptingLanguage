[package]
name = "execute-browser"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
flow = { package = "execute", path = ".." }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
strip = true
panic = "abort"

[workspace]

# Unsafe policy, as in the main crate: documented blocks and explicit unsafe operations.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
