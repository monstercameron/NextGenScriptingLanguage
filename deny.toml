# cargo-deny policy: advisories, licenses, bans, and sources. Run as
# `cargo deny --all-features check` in the security workflow. The graph covers the
# product feature set (`full`), so the TUI and model dependencies are checked too.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # ratatui 0.29 (the optional `tui` feature, shipped in `full`) pulls paste 1.0.15, a
    # proc-macro used at build time only. Track: upgrade ratatui when its API migration lands.
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, build-time proc-macro through ratatui 0.29 (tui feature)" },
    # The same ratatui 0.29 pulls lru 0.12.5 for its layout cache (LruCache::get_or_insert
    # and resize). ratatui never calls iter_mut. resize shrinks through the internal
    # pop_lru, not the public pop(); whether that path shares the advisory's unsafe code is
    # not verified here. Accepted until ratatui is upgraded past lru 0.12.
    { id = "RUSTSEC-2026-0002", reason = "lru IterMut Stacked Borrows, through ratatui 0.29 layout cache; ratatui never calls iter_mut" },
    { id = "RUSTSEC-2026-0253", reason = "lru pop() panic safety, through ratatui 0.29 layout cache; resize uses pop_lru (shared path not verified); accepted until ratatui upgrade" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# A new duplicate version fails the build. The entries below are the duplicates that
# exist today; each comes from two dependency lines that cannot yet be unified.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = true
skip = [
    { crate = "getrandom@0.2.17", reason = "ring 0.17 through rustls and ureq (the HTTP client); execute uses getrandom 0.4 directly" },
    { crate = "getrandom@0.4.3", reason = "execute's direct dependency (the per-user what-if key)" },
    { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38 through crossterm 0.28 (tui feature, via ratatui 0.29)" },
    { crate = "linux-raw-sys@0.12.1", reason = "rustix 1.x (tempfile, native-tls and signal-hook)" },
    { crate = "rustix@0.38.44", reason = "crossterm 0.28 (tui feature, via ratatui 0.29); accepted until ratatui is upgraded" },
    { crate = "rustix@1.1.5", reason = "the current major, used by tempfile, native-tls and signal-hook" },
    { crate = "syn@2.0.119", reason = "strum_macros through ratatui 0.29 (tui feature); accepted until ratatui is upgraded" },
    { crate = "syn@3.0.9", reason = "darling and instability through ratatui 0.29 (tui feature); accepted until ratatui is upgraded" },
    { crate = "unicode-width@0.1.14", reason = "unicode-truncate through ratatui 0.29 (tui feature)" },
    { crate = "unicode-width@0.2.0", reason = "execute's optional tui dependency (text width); ratatui 0.29 uses both" },
    { crate = "windows-sys@0.52.0", reason = "ring 0.17 on Windows through rustls and ureq" },
    { crate = "windows-sys@0.59.0", reason = "rustix 0.38 on Windows through crossterm 0.28 (tui feature)" },
    { crate = "windows-sys@0.61.2", reason = "execute's direct Windows dependency (Win32 APIs)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
