# Secret scanning policy for the CI gitleaks job. The default rules stay on. The
# exceptions below are narrow and reviewed; anything else found is a real finding.
title = "execute secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Placeholder token that the agent-auth unit tests use (src/live/auth.rs). It is a fixed test value, not a credential."
regexes = ['''0123456789abcdef0123456789abcdef''']

[[allowlists]]
description = "Recorded benchmark evidence and validation reports: SHA-256 digests, timings, and fingerprints, which the generic rule matches. These paths are measurement records, not credential stores; provider-specific rules were checked against them and report nothing."
paths = [
  '''^benchmarks/''',
  '''^docs/(utility-validation|validation-v[0-9.]+)\.json$''',
]

# This immutable commit adds synthetic credential-shaped values to tests that
# exercise secret redaction. Bind each exception to both that exact commit and the
# exact test file; do not suppress future findings elsewhere in these paths.
[[allowlists]]
description = "Synthetic API-key fixture in the historical agent what-if test"
condition = "AND"
commits = ["bc9239987b4af26bcce685ccfa5062725ee47c67"]
paths = ['''^tests/agent_what_if\.rs$''']

[[allowlists]]
description = "Synthetic API-key fixtures in historical explain JSON tests"
condition = "AND"
commits = ["bc9239987b4af26bcce685ccfa5062725ee47c67"]
paths = ['''^tests/agent_explain_json\.rs$''']

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Exact synthetic sentinel in the historical structured-value redaction test"
  condition = "AND"
  commits = ["ea80928b98e5ae5a78507127050fe74fdda53da0"]
  paths = ['''^src/record\.rs$''']
  regexTarget = "secret"
  regexes = ['''^(?:\x43\x41\x4e\x41\x52\x59\x2d\x50\x52\x49\x56\x41\x54\x45\x2d\x4b\x45\x59\x2d\x33\x31\x35)$''']
