# Dependency updates as reviewable pull requests. Actions are pinned by commit SHA, and
# Dependabot keeps those pins current by rewriting the SHA together with the version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /browser
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      browser-cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
