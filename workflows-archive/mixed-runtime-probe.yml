name: Mixed runtime lifecycle probe

on:
  workflow_dispatch:
    inputs:
      run_1000:
        description: Run the capped 1,000-actor probe after the 32-actor smoke passes
        required: true
        type: boolean
        default: false
      window_ms:
        description: Active window per 1,000-actor trial; 300000 ms is bounded and single-trial only
        required: true
        type: choice
        options:
          - "1000"
          - "10000"
          - "300000"
        default: "1000"
      replications:
        description: Fixed trials; 300000 ms requires one trial; every selected trial runs
        required: true
        type: choice
        options:
          - "1"
          - "3"
        default: "1"

permissions:
  contents: read

jobs:
  mixed-runtime:
    name: Linux mixed lifecycle probe
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Validate requested 1,000-actor trial bounds
        if: inputs.run_1000
        env:
          MIXED_WINDOW_MS: ${{ inputs.window_ms }}
          MIXED_REPLICATIONS: ${{ inputs.replications }}
        shell: bash
        run: |
          set -euo pipefail
          window_ms="${MIXED_WINDOW_MS}"
          replications="${MIXED_REPLICATIONS}"
          case "$window_ms" in
            1000|10000|300000) ;;
            *) echo "unsupported mixed window: $window_ms" >&2; exit 2 ;;
          esac
          case "$replications" in
            1|3) ;;
            *) echo "unsupported replication count: $replications" >&2; exit 2 ;;
          esac
          if [[ "$window_ms" == "300000" && "$replications" != "1" ]]; then
            echo "the bounded 300000 ms window supports exactly one 1,000-actor trial" >&2
            exit 2
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Build the release probe for this exact checkout
        run: cargo test --locked --release --features full --test graph_mixed_lifecycle_bench --no-run
      - name: Select the freshly built probe binary
        shell: bash
        run: |
          test_binary="$(find target/release/deps -maxdepth 1 -type f -name 'graph_mixed_lifecycle_bench-*' -perm -u+x -print -quit)"
          if [[ -z "$test_binary" ]]; then
            echo "release mixed probe binary was not produced" >&2
            exit 1
          fi
          echo "MIXED_PROBE_TEST_BINARY=$GITHUB_WORKSPACE/$test_binary" >> "$GITHUB_ENV"
      - name: Run the 32-actor correctness smoke
        run: >-
          python3 benchmarks/stress_evidence.py mixed
          --test-binary "$MIXED_PROBE_TEST_BINARY"
          --report "benchmarks/graph-mixed-lifecycle-${GITHUB_RUN_ID}-32.json"
          --final-release-build-confirmed --nodes 32 --window-ms 1000
          --overall-timeout-s 600
      - name: Run all explicitly requested 1,000-actor trials
        if: inputs.run_1000
        env:
          MIXED_WINDOW_MS: ${{ inputs.window_ms }}
          MIXED_REPLICATIONS: ${{ inputs.replications }}
        shell: bash
        run: |
          set -u

          window_ms="${MIXED_WINDOW_MS}"
          replications="${MIXED_REPLICATIONS}"
          case "$window_ms" in
            1000|10000|300000) ;;
            *) echo "unsupported mixed window: $window_ms" >&2; exit 2 ;;
          esac
          case "$replications" in
            1|3) ;;
            *) echo "unsupported replication count: $replications" >&2; exit 2 ;;
          esac
          if [[ "$window_ms" == "300000" && "$replications" != "1" ]]; then
            echo "the bounded 300000 ms window supports exactly one 1,000-actor trial" >&2
            exit 2
          fi

          failed=0
          for ((trial = 1; trial <= replications; trial++)); do
            report="benchmarks/graph-mixed-lifecycle-${GITHUB_RUN_ID}-1000-trial-${trial}.json"
            echo "Running 1,000-actor trial ${trial}/${replications} with ${window_ms} ms active window"
            if python3 benchmarks/stress_evidence.py mixed \
              --test-binary "$MIXED_PROBE_TEST_BINARY" \
              --report "$report" \
              --final-release-build-confirmed --nodes 1000 --window-ms "$window_ms" \
              --overall-timeout-s 600; then
              echo "Trial ${trial} passed: $report"
            else
              status=$?
              echo "Trial ${trial} failed with exit status ${status}; continuing to retain all declared trial receipts" >&2
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "At least one declared 1,000-actor trial failed; see per-trial failure sidecars." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mixed-runtime-lifecycle-${{ github.run_id }}
          path: benchmarks/graph-mixed-lifecycle-*.json
          if-no-files-found: warn
          retention-days: 30
