[package]
name = "execute"
version = "0.9.0-rc.5"
edition = "2021"
default-run = "execute"
description = "Readable Unix workflows with declarative applets and direct pipes"
license = "MIT"
repository = "https://github.com/monstercameron/NextGenScriptingLanguage"
homepage = "https://monstercameron.github.io/NextGenScriptingLanguage/"
readme = "README.md"
keywords = ["scripting", "unix", "pipeline", "interpreter", "automation"]
categories = ["command-line-utilities"]

[lib]
name = "flow"

[dependencies]
anyhow = "1"
base64 = "0.23"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
memchr = "2.8.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
unicode-width = "0.2"
url = { version = "2.5.8", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
libc = "0.2"
signal-hook = "0.4"
chrono = "0.4"
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }

[target.'cfg(unix)'.dependencies]
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"], optional = true }
mio = { version = "1.2.4", features = ["net", "os-poll"], optional = true }

[target.'cfg(windows)'.dependencies]
ureq = { version = "=3.4.2", default-features = false, features = ["native-tls"], optional = true }
mio = { version = "1.2.4", features = ["net", "os-poll"], optional = true }
ctrlc = "3.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Memory"] }

[features]
# Optional product areas are enabled by default; core builds can opt out of them.
default = ["graph", "screens", "records", "tooling", "module-tools", "agent-advisory"]
full = ["graph", "screens", "records", "tooling", "module-tools", "agent-advisory", "tui", "model", "desktop", "dap", "remote", "live", "lsp"]
graph = []
screens = []
records = []
tooling = []
# Package inspection and lock management for program modules.
module-tools = []
# What-if planning, explain effect gates, and standalone checkpoint inspection.
agent-advisory = []
# The terminal UI shows live session state, so it implies the live control plane.
tui = ["screens", "live", "dep:ratatui", "dep:crossterm"]
# The live control endpoint, `run --control`, and `attach`.
live = ["screens"]
# The language server behind `execute lsp`: editor completions, hovers, and diagnostics.
lsp = ["dep:url"]
# The model helper and the remote backend share the HTTP client, so each enables it.
model = ["dep:ureq", "dep:url"]
remote = ["dep:ureq", "dep:mio", "dep:url"]
# Quickshell desktop renderer nodes and the DAP adapter. Lean builds refuse both with a clear error.
desktop = ["screens", "graph"]
dap = []
# Test-only fault injection for the crash-consistency tests; never enabled by default.
failpoints = []
# Fuzz entry points (src/fuzz_entry.rs) and the regression replay test; never enabled by default.
fuzzing = ["dap", "graph", "records"]
# Test executables used by integration and Windows listener tests.
test-fixtures = []

[dev-dependencies]
tempfile = "3"
proptest = "1"
# Tests build file URIs; the binary only links url with the remote feature.
url = "2.5.8"

# Fat LTO and one codegen unit: measured on Windows, 9.87 MB -> 9.10 MB stripped, and an
# interpreter-bound loop ran about 4% faster. Build time is about 2 minutes (was 1.5).
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Release panics are bugs: abort after the standard panic diagnostic instead of carrying unwind tables.
panic = "abort"

# URL parsing is used by remote endpoint validation and capability checks, but
# not by the interpreter's text/JSON hot paths.
[profile.release.package.url]
opt-level = "z"

[profile.release.package.idna]
opt-level = "z"

[profile.release.package.idna_adapter]
opt-level = "z"

[profile.release.package.icu_normalizer]
opt-level = "z"

[profile.release.package.icu_properties]
opt-level = "z"

# These support cancellation, time-based services and bundled manifest
# compression; their work is outside interpreter text and JSON execution. sha2 stays
# at full speed because checkpoint digests run per element.
[profile.release.package.chrono]
opt-level = "z"

[profile.release.package.signal-hook]
opt-level = "z"

[profile.release.package.getrandom]
opt-level = "z"

[profile.release.package.flate2]
opt-level = "z"

[profile.release.package.miniz_oxide]
opt-level = "z"

[profile.dist]
inherits = "release"

# Explicit size-first build; unlike release, this profile does not unwind panics.
# Build with `cargo build --profile min --target x86_64-unknown-linux-musl`.
[profile.min]
inherits = "release"
opt-level = "z"
panic = "abort"

[patch.crates-io]
iana-time-zone = { path = "vendor/iana-time-zone" }

# The helper that runs model adapters; a build without `model` omits it.
[[bin]]
name = "execute-model"
path = "src/bin/execute-model.rs"
required-features = ["model"]

# The probe parses screen programs too, so a core build skips it.
[[example]]
name = "parse_probe"
path = "examples/parse_probe.rs"
required-features = ["screens"]

# Unsafe policy: every unsafe block has a `// SAFETY:` comment, and every unsafe operation
# inside an unsafe fn sits in its own block. CI runs clippy with -D warnings.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[bin]]
name = "native-fixture"
path = "tests/fixtures/native_fixture.rs"
required-features = ["test-fixtures"]

[[test]]
name = "kill_grace"
required-features = ["test-fixtures"]

[[test]]
